name: Deploy to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/mervin-redesign-e65f
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy site to S3 and invalidate CloudFront
        env:
          AWS_DEPLOY_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          AWS_DEPLOY_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'web-mervin-cz-com' }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          PUBLIC_UPLOAD_API_URL: ${{ vars.PUBLIC_UPLOAD_API_URL }}
        run: |
          chmod +x scripts/deploy-aws.sh
          ./scripts/deploy-aws.sh
