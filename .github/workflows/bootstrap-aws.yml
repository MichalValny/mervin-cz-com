name: Bootstrap AWS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap full AWS stack (account 777171524899)
        env:
          AWS_BOOTSTRAP_ACCESS_KEY_ID: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          AWS_BOOTSTRAP_SECRET_ACCESS_KEY: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'web-mervin-cz-com' }}
          UPLOAD_S3_BUCKET: ${{ vars.UPLOAD_S3_BUCKET || 'web-mervin-cz-com' }}
          UPLOAD_JWT_SECRET: ${{ secrets.UPLOAD_JWT_SECRET }}
          UPLOAD_PASSWORD_MICHAL: ${{ secrets.UPLOAD_PASSWORD_MICHAL }}
          UPLOAD_PASSWORD_HORAK: ${{ secrets.UPLOAD_PASSWORD_HORAK }}
          UPLOAD_GITHUB_TOKEN: ${{ secrets.UPLOAD_GITHUB_TOKEN }}
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
          CLOUDFRONT_ALIASES: ${{ vars.CLOUDFRONT_ALIASES }}
        run: |
          chmod +x scripts/bootstrap-aws.sh \
            scripts/setup-aws-infra.sh \
            scripts/setup-acm-certificate.sh \
            scripts/ensure-deploy-iam.sh \
            scripts/deploy-upload-api.sh
          ./scripts/bootstrap-aws.sh

      - name: Commit infrastructure config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/aws-infra.json src/data/upload-api.json || true
          if git diff --staged --quiet; then
            echo "No infrastructure config changes to commit."
          else
            git commit -m "Configure AWS infrastructure after bootstrap"
            git push
          fi
