name: Upload post

on:
  repository_dispatch:
    types: [process-upload]
  workflow_dispatch:
    inputs:
      upload_id:
        description: Upload bundle ID in S3
        required: true
        type: string
      author:
        description: Upload author username
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      UPLOAD_ID: ${{ github.event.inputs.upload_id || github.event.client_payload.upload_id }}
      UPLOAD_AUTHOR: ${{ github.event.inputs.author || github.event.client_payload.author }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pillow pillow-heif boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Build post files from upload
        id: build
        env:
          UPLOAD_S3_BUCKET: ${{ vars.UPLOAD_S3_BUCKET || 'web-mervin-cz-com' }}
          UPLOAD_S3_PREFIX: ${{ vars.UPLOAD_S3_PREFIX || 'uploads-staging' }}
        run: |
          python3 scripts/process-upload.py "$UPLOAD_ID" > upload-result.json
          cat upload-result.json
          {
            echo 'result<<UPLOAD_RESULT'
            cat upload-result.json
            echo 'UPLOAD_RESULT'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG="$(jq -r '.slug' upload-result.json)"
          TITLE="$(jq -r '.title' upload-result.json)"
          BRANCH="upload/${SLUG}-${UPLOAD_ID}"
          BODY="$(printf '%s\n' \
            "Automatický upload od **${UPLOAD_AUTHOR}**." \
            "" \
            "Upload ID: \`${UPLOAD_ID}\`" \
            "" \
            "Po kontrole prosím sloučte tento PR. Deploy proběhne automaticky.")"
          git lfs install
          git checkout -b "$BRANCH"
          git add src/data/posts.json src/content/posts public/galleries
          git -c user.name='Mervin Upload Bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Upload: ${TITLE} (${UPLOAD_AUTHOR})"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Upload: ${TITLE}" \
            --body "$BODY"
